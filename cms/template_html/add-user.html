<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Add User</title>
</head>

<body>
    <!-- Add User -->
    <form class="max-w-3xl mx-auto bg-[#DDA15E] mt-10 rounded-xl border border-amber-200/60 shadow-sm">
        <div id="Title">
            <h1 class="m-10 font-bold text-2xl max-">Register account</h1>
        </div>
        <div id="container-input" class="grid grid-cols-2 gap-4 mt-10 px-10">
            <div id="create-username">
                <label for="label">
                    <span class="font-bold text-xl">Username</span>
                </label> <br>
                <input type="text" class="bg-[#FEFAE0] rounded-2xl px-3 py-2 border-2 border-black">
            </div>
            <div id="create-email">
                <label for="label">
                    <span class="font-bold text-xl">Email</span>
                </label> <br>
                <input type="text" class="bg-[#FEFAE0] rounded-2xl px-3 py-2 border-2 border-black">
            </div>
            <div id="create-password">
                <label for="label">
                    <span class="font-bold text-xl">Password</span>
                </label> <br>
                <input type="password" class="bg-[#FEFAE0] rounded-2xl px-3 py-2 border-2 border-black">
            </div>
            <div id="create-phoneNumber">
                <label for="label">
                    <span class="font-bold text-xl">Phone Number</span>
                </label> <br>
                <input type="text" class="bg-[#FEFAE0] rounded-2xl px-3 py-2 border-2 border-black">
            </div>
            <div id="create-address">
                <label for="label">
                    <span class="font-bold text-xl">Address</span>
                </label> <br>
                <input type="text" class="bg-[#FEFAE0] rounded-2xl px-3 py-2 border-2 border-black">
            </div>
        </div>


        <div className="mt-5">
            <button
                class="w-full mt-5 py-2 px-4 border-2 border-black rounded-2xl text-sm font-medium text-white bg-[#606C38] hover:bg-[#283618] shadow-[2px_2px_0px_rgba(0,0,0,1)]">
                Add User
            </button>
        </div>
    </form>
</body>

</html>
